receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  filelog/docker_logs:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_name: false
    include_file_path: true
    operators:
    - type: json_parser
      if: body matches "^{.*}$"
      parse_to: attributes
      output: parse_container_name
    - id: recombine
      type: recombine
      combine_field: body
      is_first_entry: body matches "^\\d{4}-\\d{2}-\\d{2}T\\d{2}"
    - type: regex_parser
      id: parse_container_name
      regex: '(?P<container_name>.+)'
      parse_from: attributes.attrs.tag

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    excluded_images:
      - "ghcr.io/zaproxy/zaproxy:stable"
      - "jira-clone-migrate*"

    metrics:
      container.cpu.utilization:
        enabled: true
      container.cpu.usage.total:
        enabled: true
      container.cpu.usage.system:
        enabled: true
      container.cpu.usage.percpu:
        enabled: true
      container.memory.percent:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.network.io.usage.rx_dropped:
        enabled: true
      container.network.io.usage.tx_dropped:
        enabled: true
      container.memory.usage.limit:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true
      container.uptime:
        enabled: true
      container.restarts:
        enabled: true
  
  postgresql:
    endpoint: "${DB_ENDPOINT}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    databases: "${DB_NAME}"
    collection_interval: 10s
    tls:
      insecure: true
      insecure_skip_verify:
        true

  redis:
    endpoint: "${REDIS_ENDPOINT}"
    collection_interval: 10s

  nginx:
     endpoint: "http://${NGINX_STATUS}/status"
     collection_interval: 10s

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s
  resourcedetection/env:
    detectors: [env]
    timeout: 2s
    override: false
  resourcedetection/system:
    detectors: ["system"]
    system:
      hostname_sources: ["dns", "os"]
  resourcedetection/docker:
    detectors: [env, docker]
    timeout: 2s
    override: false
  filter/metrics:
    metrics:
      include:
        match_type: regexp
        resource_attributes:
          - key: container.name
            value: "^jiradocker.*"
  filter/logs:
    logs:
      include:
        match_type: regexp
        record_attributes:
          - key: 	container_name
            value: "^jiradocker.*"
  filter/empty:
    logs:
      include:
        match_type: regexp

exporters:
  splunk_hec/metrics:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    index: docker_metrics
    source: "otel"
    sourcetype: "otel"
    tls:
      insecure_skip_verify: true
  
  splunk_hec/logs:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    index: docker_logs
    source: "otel"
    sourcetype: "otel"
    tls:
      insecure_skip_verify: true
    
  splunk_hec/traces:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    index: docker_traces
    source: "otel"
    sourcetype: "otel"
    tls:
      insecure_skip_verify: true
  
  
service:
  pipelines:
    metrics/global:
      receivers: [docker_stats]
      processors: 
        - resourcedetection/env
        - resourcedetection/system
        - resourcedetection/docker
        - filter/metrics
        - filter/empty
        - batch
      exporters: [splunk_hec/metrics]
    
    metrics/services:
      receivers: [postgresql, redis, nginx]
      processors: 
        - resourcedetection/env
        - resourcedetection/system
        - resourcedetection/docker
        - filter/empty
        - batch
      exporters: [splunk_hec/metrics]
    
    logs:
      receivers: [filelog/docker_logs]
      processors:
        - resourcedetection/env
        - resourcedetection/system
        - resourcedetection/docker
        - filter/logs
        - filter/empty
        - batch
      exporters: [splunk_hec/logs]
  
    traces:
      receivers: [otlp]
      processors:
          - resourcedetection/env
          - resourcedetection/system
          - resourcedetection/docker
          - filter/empty
          - batch
      exporters: [splunk_hec/traces]